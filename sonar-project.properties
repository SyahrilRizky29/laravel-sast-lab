# ==============================================================================
# SonarQube Project Configuration — Laravel SAST Lab
# ==============================================================================
#
# CARA PENGGUNAAN:
#   1. Ganti <TOKEN_ANDA> dengan token yang dibuat di SonarQube Web UI
#   2. Pastikan SonarQube sudah berjalan di http://localhost:9000
#   3. Jalankan: sonar-scanner (dari root folder project ini)
#
# ⚠️  PERINGATAN KEAMANAN:
#   Jangan commit file ini ke repository jika sudah berisi token asli!
#   Tambahkan sonar-project.properties ke .gitignore Anda.
#
# ==============================================================================

# ─── Project Identity ──────────────────────────────────────────────────────────
sonar.projectKey=Laravel-SAST-LAB
sonar.projectName=Laravel SAST Lab
sonar.projectVersion=1.0.0
sonar.projectDescription=Sample Laravel project with intentional vulnerabilities for SAST learning

# ─── SonarQube Server ──────────────────────────────────────────────────────────
# sonar.host.url=http://localhost:9000

# Token autentikasi — buat di: SonarQube > My Account > Security > Generate Token
# sonar.token=<TOKEN_ANDA>

# ─── Source Code ───────────────────────────────────────────────────────────────
# Folder-folder yang akan di-scan
sonar.sources=app,routes,config,database

# Folder test (dianalisis secara terpisah)
sonar.tests=tests

# ─── Language ──────────────────────────────────────────────────────────────────
sonar.language=php
sonar.php.version=8.1

# ─── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── Exclusions ────────────────────────────────────────────────────────────────
# Folder yang TIDAK perlu di-scan
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  storage/**,\
  bootstrap/cache/**,\
  public/vendor/**,\
  *.min.js,\
  *.min.css

# File test yang di-include
sonar.test.inclusions=tests/**/*.php

# ─── Coverage (Opsional) ───────────────────────────────────────────────────────
# Jika menggunakan PHPUnit dengan coverage report:
# sonar.php.coverage.reportPaths=coverage/clover.xml
# sonar.php.tests.reportPath=coverage/junit.xml

# ─── Quality Gate ──────────────────────────────────────────────────────────────
# Gunakan quality gate default SonarQube ("Sonar way")
# Konfigurasi tambahan bisa diatur di SonarQube Web UI
